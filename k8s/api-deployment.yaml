apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-review-api
  namespace: ai-gateway
  labels:
    app: code-review-api
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: code-review-api
  template:
    metadata:
      labels:
        app: code-review-api
        component: api
    spec:
      containers:
        - name: code-review-api
          # Reemplaza ACCOUNT_ID con: aws sts get-caller-identity --query Account --output text
          image: ACCOUNT_ID.dkr.ecr.eu-west-1.amazonaws.com/code-review-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: LITELLM_URL
              value: "http://litellm-service:4000"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master_key
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
