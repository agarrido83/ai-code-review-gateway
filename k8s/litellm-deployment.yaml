apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai-gateway
  labels:
    app: litellm
    component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
        component: gateway
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          command: ["litellm", "--host", "0.0.0.0", "--port", "4000", "--config", "/app/config.yaml"]
          ports:
            - containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master_key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: database_url
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml  # monta el fichero, no el directorio
          # LiteLLM arranca Prisma ORM (Node.js) + Python: supera 1Gi en el arranque (OOMKilled con 1Gi)
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: litellm-config
